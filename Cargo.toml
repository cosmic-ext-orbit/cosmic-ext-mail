[package]
name = "cosmic-ext-mail"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A mail client for the COSMIC desktop"
repository = "https://github.com/cosmic-utils/cosmic-ext-mail"

[dependencies]
base64 = "0.22"
euclid = "0.22"
http = "1"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
lol_html = "3.0.3"
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
open = "5.3.2"
rust-embed = "8.8.0"
servo = { version = "=0.8.0", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
tokio = { version = "1.48.0", features = ["full"] }
url = "2.5"
urlencoding = "2.1"

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Markdown widget
    "markdown",
    # QR code widget
    "qr_code",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
